{% extends "base.html" %}
{% load static %}
{% block content %}
        <header class="header">
            <h1 class="title">MicroBiz Reality Check Agent</h1>
            <p class="subtitle">Test your business idea with numbers before spending money.</p>
        </header>

        <form id="reality-check-form" class="form" novalidate>
            <div class="form-group">
                <label for="business_type" class="label">Business Type</label>
                <input 
                    type="text" 
                    id="business_type" 
                    name="business_type" 
                    class="input" 
                    placeholder="e.g., Coffee shop, Online tutoring, Food truck"
                    required
                >
                <span class="error-message" id="business_type_error"></span>
            </div>

            <div class="form-group">
                <label for="location" class="label">Location</label>
                <input 
                    type="text" 
                    id="location" 
                    name="location" 
                    class="input" 
                    placeholder="e.g., Downtown Seattle, WA"
                    required
                >
                <span class="error-message" id="location_error"></span>
            </div>

            <div class="form-group">
                <label for="C_start" class="label">Startup Capital </label>
                <input 
                    type="number" 
                    id="C_start" 
                    name="C_start" 
                    class="input" 
                    placeholder="e.g., 10000.00 (startup capital)"
                    min="0"
                    step="0.01"
                    required
                >
                <span class="error-message" id="C_start_error"></span>
            </div>

            <div class="form-group">
                <label for="T" class="label">Time(months) </label>
                <input 
                    type="number" 
                    id="T" 
                    name="T" 
                    class="input" 
                    placeholder="e.g., 6 months"
                    min="0"
                    step="1"
                    required
                >
                <span class="error-message" id="T_error"></span>
            </div>

            <div class="form-group">
                <label for="P" class="label">Target Selling Price</label>
                <input 
                    type="number" 
                    id="P" 
                    name="P" 
                    class="input" 
                    placeholder="e.g., 2000.00"
                    min="0"
                    step="0.01"
                    required
                >
                <span class="error-message" id="P_error"></span>
            </div>

            <div class="form-group">
                <label for="Q" class="label">Monthly sales volume</label>
                <input 
                    type="number" 
                    id="Q" 
                    name="Q" 
                    class="input" 
                    placeholder="e.g., 1500.00 (monthly estimated items sold)"
                    min="0"
                    step="1"
                    required
                >
                <span class="error-message" id="Q_error"></span>
            </div>

            <div class="form-group">
                <label for="g" class="label">Growth Rate Per Month</label>
                <input 
                    type="number" 
                    id="g" 
                    name="g" 
                    class="input" 
                    placeholder="e.g., 2 (percentage growth rate per month)"
                    min="0"
                    step="1"
                    required
                >
                <span class="error-message" id="g_error"></span>
            </div>

            <div class="form-group">
                <label for="E_fix" class="label">Fixed costs</label>
                <input 
                    type="number" 
                    id="E_fix" 
                    name="E_fix" 
                    class="input" 
                    placeholder="e.g., 40000"
                    min="0"
                    step="0.01"
                    required
                >
                <span class="error-message" id="E_fix_error"></span>
            </div>

            <div class="form-group">
                <label for="E_var" class="label">Variable costs</label>
                <input 
                    type="number" 
                    id="E_var" 
                    name="E_var" 
                    class="input" 
                    placeholder="e.g., 50000"
                    required
                >
                <span class="error-message" id="E_var_error"></span>
            </div>

            <div class="form-group">
                <label for="C_startup" class="label">Start up capital</label>
                <input 
                    type="number" 
                    id="C_startup" 
                    name="C_startup" 
                    class="input" 
                    placeholder="e.g., 45000"
                    required
                >
                <span class="error-message" id="C_startup_error"></span>
            </div>
            
            <div class="form-group">
                <label for="initial_inventory_units" class="label">Initial Inventory</label>
                <input 
                    type="number" 
                    id="initial_inventory_units" 
                    name="initial_inventory_units" 
                    class="input" 
                    placeholder="e.g., 200 units"
                    required
                >
                <span class="error-message" id="initial_inventory_units_error"></span>
            </div>
            
            <button type="submit" id="submit-btn" class="button" disabled>
                <span class="button-text">Run Reality Check</span>
                <span class="spinner hidden"></span>
            </button>
        </form>

        <section id="results" class="results hidden">
            <h2 class="results-title">Reality Check Results</h2>
            
            <div id="explanation" class="result-card">
                <h3 class="result-card-title">Assessment</h3>
                <div id="explanation-content" class="result-content"></div>
            </div>

            <div id="questions-section" class="result-card hidden">
                <h3 class="result-card-title">Follow-up Questions</h3>
                <ul id="questions-list" class="questions-list"></ul>
            </div>

            <div class="disclaimer">
                <p id="disclaimer-text"></p>
            </div>
        </section>

        <section id="error-section" class="error-section hidden">
            <h2 class="error-title">Error</h2>
            <ul id="error-list" class="error-list"></ul>
        </section>
{% endblock %}
